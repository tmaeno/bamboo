name: tests

# Runs the unit suite. Nothing here needs a service: the graph client connects
# lazily, so backends construct without a database, and the tests that would talk
# to Neo4j / Qdrant / an LLM / PanDA use fixtures.
#
# Only the `dev` extra is installed. `local` (torch, sentence-transformers) is far
# too heavy, `panda` is not needed — the Code Map tests parse source held in the
# tests as strings — and `mattermost` is currently unusable anyway: 2.x's
# `endpoints/access_control.py` imports a `FileType` its own `_base` no longer
# exports. The two tests that need that driver skip when it is absent.
#
# This costs about a minute, and finding out what it costs was the point: the
# suite had never been run outside a developer's own machine.

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # Editable, because `testpaths = ["tests"]` is outside the installed
        # package and tests/conftest.py aborts if a declared dependency is absent.
        run: pip install -e ".[dev]"

      - name: Unit tests
        env:
          # Not a secret and never sent anywhere. The LangChain OpenAI client
          # refuses to *construct* without a key, so 36 tests that mock every
          # call still need one present to reach the code they are testing.
          # Locally a developer's ~/.config/bamboo/.env supplies it, which is
          # why this only showed up once there was a CI run.
          LLM_API_KEY: not-a-real-key-nothing-is-called
        run: pytest -q -m "not timing"

      - name: Timing-sensitive tests (not a gate)
        # These assert on how fast a child process delivers output, so a shared
        # runner loses races a laptop wins. Reported, never merged on — see the
        # `timing` marker in pyproject.toml for why they are not simply deleted.
        continue-on-error: true
        run: pytest -q -m timing
